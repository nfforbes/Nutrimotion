name: iOS Build & TestFlight

on:
  push:
    branches: [master, main]
    paths:
      - "mobile-apps/nutrimotion-cmp/**"
      - ".github/workflows/deploy-ios-testflight.yml"
  pull_request:
    paths:
      - "mobile-apps/nutrimotion-cmp/**"
      - ".github/workflows/deploy-ios-testflight.yml"
  workflow_dispatch:

concurrency:
  group: ios-nutrimotion-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  # Kotlin/Native link of Compose can OOM at the default 2g (same as Lukaria).
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dkotlin.daemon.jvmargs=-Xmx6g"

jobs:
  build-framework:
    name: Compile ComposeApp (iOS)
    runs-on: macos-26
    defaults:
      run:
        working-directory: mobile-apps/nutrimotion-cmp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Link release framework (iosArm64)
        run: ./gradlew :composeApp:linkReleaseFrameworkIosArm64 --stacktrace

  deploy-testflight:
    name: Archive & upload TestFlight
    needs: build-framework
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    defaults:
      run:
        working-directory: mobile-apps/nutrimotion-cmp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Apple Team ID
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Missing secret APPLE_TEAM_ID (Apple Developer Team ID). Add it under repo Settings → Secrets (same as Lukaria: 3CPQ68PXHC)."
            exit 1
          fi

      - name: Select Xcode (latest stable / iOS SDK required by App Store Connect)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: mobile-apps/nutrimotion-cmp

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd iosApp
          xcodegen generate

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          if [ -z "$APP_STORE_CONNECT_API_KEY_P8" ] || [ -z "$APP_STORE_CONNECT_API_KEY_ID" ]; then
            echo "::error::Missing APP_STORE_CONNECT_API_KEY_P8 / APP_STORE_CONNECT_API_KEY_ID (reuse Lukaria secrets)."
            exit 1
          fi
          mkdir -p "$HOME/private_keys"
          KEY_PATH="$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY_P8" > "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Inject Team ID into xcconfig
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed -i '' "s/^TEAM_ID=.*/TEAM_ID=${APPLE_TEAM_ID}/" iosApp/Configuration/Config.xcconfig
          sed -i '' "s/TEAM_ID_PLACEHOLDER/${APPLE_TEAM_ID}/" iosApp/ExportOptions.plist
          cat iosApp/Configuration/Config.xcconfig

      - name: Bump CFBundleVersion from run number
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" iosApp/iosApp/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" iosApp/iosApp/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" iosApp/iosApp/Info.plist

      - name: Restore distribution signing keychain
        id: keychain-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Keychains/nutrimotion-ci.keychain-db
            ~/Library/Keychains/nutrimotion-ci.keychain-db-shm
            ~/Library/Keychains/nutrimotion-ci.keychain-db-wal
            ~/Library/MobileDevice/Provisioning Profiles
          key: ios-dist-keychain-nutrimotion-${{ secrets.APPLE_TEAM_ID }}-v1
          restore-keys: |
            ios-dist-keychain-nutrimotion-${{ secrets.APPLE_TEAM_ID }}-v1-

      - name: Build IPA + upload TestFlight (Fastlane)
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          CI_KEYCHAIN_PASSWORD: nutrimotion-ci-temp
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: bundle exec fastlane ios beta

      - name: Save distribution signing keychain
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Keychains/nutrimotion-ci.keychain-db
            ~/Library/Keychains/nutrimotion-ci.keychain-db-shm
            ~/Library/Keychains/nutrimotion-ci.keychain-db-wal
            ~/Library/MobileDevice/Provisioning Profiles
          key: ios-dist-keychain-nutrimotion-${{ secrets.APPLE_TEAM_ID }}-v1-${{ github.run_id }}

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nutrimotion-ios-ipa
          path: |
            ${{ runner.temp }}/Nutrimotion.ipa
            ${{ runner.temp }}/Nutrimotion.xcarchive
          if-no-files-found: ignore
          retention-days: 14
